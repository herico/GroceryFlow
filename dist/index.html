    <title>GroceryFlow</title>
    <script>
      // Resolve appearance (accent + light/dark) before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('groceryflow:settings') || '{}')
          var el = document.documentElement
          if (s.theme) el.setAttribute('data-theme', s.theme)
          var mode = s.mode || 'system'
          var supportsMatchMedia = typeof window.matchMedia === 'function'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              supportsMatchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          el.setAttribute('data-mode', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-mode', 'light')
        }
      })()
    </script>
